name: Restore ChapterGrade source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore source files
        shell: bash
        run: |
          node -e "const fs=require('fs'),zlib=require('zlib');const data=fs.readFileSync('.chaptergrade-source.br.b64','utf8').trim();fs.writeFileSync('/tmp/chaptergrade-source.tar',zlib.brotliDecompressSync(Buffer.from(data,'base64')))"
          tar -xf /tmp/chaptergrade-source.tar
          rm -f .chaptergrade-source.br.b64
      - name: Commit application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add ChapterGrade readability assessment app"
          git push origin HEAD:main
